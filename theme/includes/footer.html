<button id="back-to-top" type="button" title="返回顶部" aria-label="返回顶部">↑</button>
<script>
(function () {
  var btn = document.getElementById('back-to-top');
  if (!btn) return;
  var onScroll = function () {
    if (window.scrollY > 400) btn.classList.add('show');
    else btn.classList.remove('show');
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
<script>
(function () {
  var meta = document.getElementById('meta-theme-color');
  if (!meta) return;
  // 地址栏主题色直接读 tokens.css 的 --page-bg 计算值（body.quarto-dark 切换后自动取暗色），
  // 避免与令牌双写漂移；取不到时按当前明暗兜底
  var sync = function () {
    var v = window.getComputedStyle(document.body).getPropertyValue('--page-bg').trim();
    if (!v) v = document.body.classList.contains('quarto-dark') ? '#131010' : '#fdfcfc';
    meta.setAttribute('content', v);
  };
  sync();
  if (window.MutationObserver) {
    new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  }
})();
</script>
<script>
(function () {
  // Quarto zh 语言包给搜索框注入的 placeholder 是「搜索」，统一改回 Search
  // （与 GitHub / opencode 观感一致；input 由 JS 运行时注入，需 MutationObserver 兜底）
  var setPlaceholder = function () {
    var input = document.querySelector('#quarto-search input, .quarto-navbar-search input');
    if (input && input.getAttribute('placeholder') !== 'Search') {
      input.setAttribute('placeholder', 'Search');
    }
  };
  setPlaceholder();
  window.addEventListener('load', setPlaceholder);
  var box = document.getElementById('quarto-search');
  if (box && window.MutationObserver) {
    new MutationObserver(setPlaceholder).observe(box, { childList: true, subtree: true });
  }
})();
</script>
