name: "render check"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 渲染以暴露结构性错误（缺文件/引用失效等）
      - run: quarto render
      # 同时验证后处理脚本本身可用
      - run: python3 .agents/skills/maintaining-python/scripts/render/defer_mermaid.py
