name: "quarto build & deploy"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: quarto render
      - run: python3 scripts/defer-mermaid.py
      - name: Publish _book to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
      - name: Ensure Pages source = gh-pages /(root) and request a build
        run: |
          api=https://api.github.com/repos/${{ github.repository }}/pages
          auth="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          accept="Accept: application/vnd.github+json"
          body='{"source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "$auth" -H "$accept" "$api" -d "$body")
          echo "POST /pages -> HTTP $code"
          if [ "$code" = "409" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -H "$auth" -H "$accept" "$api" -d "$body")
            echo "PUT /pages (source correction) -> HTTP $code"
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "$auth" -H "$accept" "$api/builds")
          echo "POST /pages/builds (force build) -> HTTP $code"
          if [ "$code" != "201" ] && [ "$code" != "202" ] && [ "$code" != "409" ]; then
            echo "WARNING: Pages build request returned HTTP $code (non-fatal)."
            echo "Check Settings -> Pages -> Build history if the site does not update."
          fi
