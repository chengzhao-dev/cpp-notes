project:
  type: book

book:
  title: "C++ 笔记"
  # 站点级（GitHub Pages / 社交分享）：Book 的站点工具选项归 book: 键（Quarto 官方约定），
  # 放在顶层不会被识别（sitemap 等据此生成）
  site-url: "https://chengzhao-dev.github.io/cpp-notes"
  repo-url: "https://github.com/chengzhao-dev/cpp-notes"
  # 站点图标：由 .agents/skills/python-tools/scripts/maintenance/generate_favicon.py 生成（矢量源在同一脚本里）
  favicon: ".agents/skills/quarto-theme/assets/theme/assets/favicon.svg"
  page-navigation: true
  navbar:
    title: "C++ 笔记"
    search: true
  chapters:
    - index.qmd
    - part: content/getting-started/index.qmd
      chapters:
        - content/getting-started/setup-wsl2.qmd
        - content/getting-started/first-program.qmd
        - content/getting-started/cmake-project.qmd
        - content/getting-started/multi-file-project.qmd
        - content/getting-started/static-library.qmd
        - content/getting-started/shared-library.qmd

# Callout 中文标题（覆盖 Quarto zh 语言包：zh 默认 note=注记、caution=注意）
language:
  callout-note-title: "注意"
  callout-tip-title: "提示"
  callout-important-title: "重要"
  callout-warning-title: "警告"
  callout-caution-title: "危险"

format:
  html:
    theme:
      # 页面颜色由 theme tokens.css 提供 GitHub 风格，代码高亮使用下方内置主题。
      light: [cosmo, .agents/skills/quarto-theme/assets/theme/scss/theme-light.scss]
      dark: [darkly, .agents/skills/quarto-theme/assets/theme/scss/theme-dark.scss]
    grid:
      # 三栏宽度预算：sidebar + body + margin + 两条 gutter 必须 <= 目标视口，
      # 否则 Quarto 按比例压缩正文列（body-width 只是上限声明，不是保证值）。
      # 240 + 800 + 208 + 32 = 1280；正文目标宽度为 800px。
      sidebar-width: 240px
      body-width: 800px
      margin-width: 208px
      gutter-width: 1rem
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    toc-location: right
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    css:
      - .agents/skills/quarto-theme/assets/theme/css/fonts.css
      - .agents/skills/quarto-theme/assets/theme/css/tokens.css
      - .agents/skills/quarto-theme/assets/theme/css/base.css
      - .agents/skills/quarto-theme/assets/theme/css/code.css
      - .agents/skills/quarto-theme/assets/theme/css/content.css
      - .agents/skills/quarto-theme/assets/theme/css/mermaid.css
      - .agents/skills/quarto-theme/assets/theme/css/nav.css
      - .agents/skills/quarto-theme/assets/theme/css/sidebar.css
      - .agents/skills/quarto-theme/assets/theme/css/callouts.css
      - .agents/skills/quarto-theme/assets/theme/css/landing.css
    number-sections: false
    highlight-style:
      # 明暗模式都采用 GitHub 官方风格；不再叠加自定义 token 颜色。
      light: github-light
      dark: github-dark
    filters:
      - .agents/skills/quarto-docs/scripts/answer-disclosure.lua
    # mermaid 不配置 theme：quarto-diagram 的 init.js 走 --mermaid-* 变量驱动的
    # 内置 themeCSS 路径，配色/字体由 theme/css/mermaid.css 控制（明暗自适应）
    include-in-header:
      - .agents/skills/quarto-theme/assets/theme/includes/fonts.html
    include-after-body:
      - .agents/skills/quarto-theme/assets/theme/includes/footer.html
    open-graph: true
    twitter-card: true
    lang: zh

resources:
  # 整目录发布：自托管 woff2 + 站点图标 favicon.svg
  - .agents/skills/quarto-theme/assets/theme/assets
