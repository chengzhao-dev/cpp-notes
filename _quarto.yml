project:
  type: book

book:
  title: "C++ 笔记"
  # 站点级（GitHub Pages / 社交分享）：Book 的站点工具选项归 book: 键（Quarto 官方约定），
  # 放在顶层不会被识别（sitemap 等据此生成）
  site-url: "https://chengzhao-dev.github.io/cpp-notes"
  repo-url: "https://github.com/chengzhao-dev/cpp-notes"
  # 站点图标：由 scripts/maint/gen_favicon.py 生成（矢量源在同一脚本里）
  favicon: "theme/assets/favicon.svg"
  page-navigation: true
  navbar:
    title: "C++ 笔记"
    search: true
  chapters:
    - index.qmd
    - part: content/getting-started/index.qmd
      chapters:
        - content/getting-started/setup-wsl2.qmd
        - content/getting-started/first-program.qmd

# Callout 中文标题（覆盖 Quarto zh 语言包：zh 默认 note=注记、caution=注意）
language:
  callout-note-title: "注意"
  callout-tip-title: "提示"
  callout-important-title: "重要"
  callout-warning-title: "警告"
  callout-caution-title: "危险"

format:
  html:
    theme:
      # 页面颜色由 theme tokens.css 提供 GitHub 风格，代码高亮使用下方内置主题。
      light: [cosmo, theme/scss/theme-light.scss]
      dark: [darkly, theme/scss/theme-dark.scss]
    pandoc-args:
      - "-f"
      - "markdown-smart"
    grid:
      sidebar-width: 300px
      body-width: 860px
      margin-width: 260px
      gutter-width: 1.5em
    respect-user-color-scheme: true
    toc: true
    toc-depth: 4
    toc-location: right
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    css:
      - theme/css/fonts.css
      - theme/css/tokens.css
      - theme/css/base.css
      - theme/css/code.css
      - theme/css/content.css
      - theme/css/mermaid.css
      - theme/css/nav.css
      - theme/css/sidebar.css
      - theme/css/callouts.css
      - theme/css/landing.css
    number-sections: false
    highlight-style:
      # 明暗模式都采用 GitHub 官方风格；不再叠加自定义 token 颜色。
      light: github-light
      dark: github-dark
    # mermaid 不配置 theme：quarto-diagram 的 init.js 走 --mermaid-* 变量驱动的
    # 内置 themeCSS 路径，配色/字体由 theme/css/mermaid.css 控制（明暗自适应）
    include-in-header:
      - theme/includes/fonts.html
    include-after-body:
      - theme/includes/footer.html
    open-graph: true
    twitter-card: true
    lang: zh

resources:
  # 整目录发布：自托管 woff2 + 站点图标 favicon.svg
  - theme/assets
